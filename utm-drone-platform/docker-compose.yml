  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_DB: skygrid_utm
  #     POSTGRES_USER: utm_user
  #     POSTGRES_PASSWORD: utm_pass
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #
  # volumes:
  #   pgdata:
