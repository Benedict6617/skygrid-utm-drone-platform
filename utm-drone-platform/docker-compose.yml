version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/data/skygrid_utm.db
    volumes:
      - ./data:/app/data
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Optional: switch DATABASE_URL above to point here for a production-like
  # Postgres setup. Left commented out so the default `docker compose up`
  # stays zero-config with SQLite.
